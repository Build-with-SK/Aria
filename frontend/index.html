<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ARIA — Open Finance Intelligence</title>
    <meta name="description" content="ARIA: the open-source AI finance terminal. Signals, cognition, quant analytics — research & education only." />
    <meta name="theme-color" content="#030103" />

    <!-- Installable to the home screen on Android and iOS. iOS ignores the
         manifest for the app title and status bar, hence the apple-* tags. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ARIA" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- viewport-fit=cover + safe-area insets in index.css keep the deck clear
         of the notch and the home indicator once installed. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23ff2447' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23ff2447' stroke-width='1.4' opacity='.6'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff2447'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
