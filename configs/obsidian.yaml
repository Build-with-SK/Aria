obsidian:
  enabled: true
  # Relative to the repo root, so this file names no particular machine or
  # user. An absolute path works too. Resolution order for the brain's own
  # vault index is: data/vault_config.json, then $ARIA_VAULT_PATH, then this.
  vault_root: "../DigitalBrain"
  tis_root: "../DigitalBrain/01 - Trading/TIS"
  folders:
    dashboard:    "00 Dashboard"
    daily_logs:   "01 Daily Market Logs"
    signals:      "02 Signal Reports"
    assets:       "03 Asset Notes"
    backtest:     "04 Backtest Reports"
    risk:         "05 Risk Reports"
    portfolio:    "06 Portfolio Reports"
    derivatives:  "07 Futures and Options"
    ml:           "08 ML Predictions"
    audit:        "09 Model Audit Logs"
    system:       "10 System Development Logs"
