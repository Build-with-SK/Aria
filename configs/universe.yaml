# configs/universe.yaml
# Trading Intelligence System — Expanded Universe
# 500+ tickers across all asset classes

# ─────────────────────────────────────────────────────────────────────────────
# DATA
# ─────────────────────────────────────────────────────────────────────────────
data:
  period: "2y"
  interval: "1d"
  fetch_fundamentals: true
  cache_dir: "data/cache"

# ─────────────────────────────────────────────────────────────────────────────
# OBSIDIAN
# ─────────────────────────────────────────────────────────────────────────────
obsidian:
  vault_path: "C:/Users/sound/Documents/DigitalBrain"
  tis_folder: "01 - Trading/TIS"
  overwrite_files:
    - "latest_signals.md"
    - "risk_summary.md"
    - "model_status.md"
  append_files:
    - "system_log.md"
    - "Pulse Market Log.md"
  protected_files:
    - "Trading Intelligence Dashboard"
    - "Pulse Bridge Dashboard"
    - "Market Intelligence Index"
    - "Asset Master Index"
    - "Risk Dashboard"
    - "Model Status Dashboard"
  tags:
    - "#pulse"
    - "#pulse-scan"
    - "#nine-am-scan"
    - "#market-scanner"
    - "#daily-scan"
    - "#trading"
    - "#market-intelligence"
    - "#capitalwithsk"

