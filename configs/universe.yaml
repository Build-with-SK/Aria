# ─────────────────────────────────────────────────────────────────────────────
# EXECUTION / AUTO-PROPOSE
# ─────────────────────────────────────────────────────────────────────────────
execution:
  account_equity: 100000        # Alpaca paper account size
  min_signal_score: 25          # Only propose if |composite_score| >= this
  max_auto_proposals: 5         # Max new trades per pipeline run
  # Increase min_signal_score to be more selective (e.g. 35 = only very strong signals)
  # Decrease to see more proposals (e.g. 15 = moderate signals included)

# BACKTEST
# ─────────────────────────────────────────────────────────────────────────────
backtest:
  initial_capital: 100000
  commission_pct: 0.001
  slippage_pct: 0.0005
  signal_threshold: 15
  risk_per_trade: 0.50
  stop_loss_pct: 0.05
  max_drawdown_limit: 0.20
  run_backtest: false

# ─────────────────────────────────────────────────────────────────────────────
# ML
# ─────────────────────────────────────────────────────────────────────────────
ml:
  enabled: true
  prediction_horizons: [1, 5, 20]
  min_training_rows: 120
  cv_splits: 5
  keep_versions: 3
  model_dir: "data/models"
  target_mode: "direction"
  use_risk_adjusted: true
  use_triple_barrier: false
  direction_threshold_pct: 0.005
  ensemble_meta_learner: "elasticnet"
  regime_adjustment: true
  calibrate_probabilities: true
  feature_lag: 1
  use_cross_asset: true
  use_macro_features: true
  use_sentiment_features: true
  use_microstructure: true

# ─────────────────────────────────────────────────────────────────────────────
# MACRO
# ─────────────────────────────────────────────────────────────────────────────
macro:
  cache_ttl_hours: 6
  fred_series:
    fed_funds: "FEDFUNDS"
    cpi_yoy: "CPIAUCSL"
    unemployment: "UNRATE"
    yield_10y: "GS10"
    yield_2y: "GS2"

# ─────────────────────────────────────────────────────────────────────────────
# STRATEGY CONFIGS
# ─────────────────────────────────────────────────────────────────────────────
strategies:

  equity_long_short:
    n_longs: 5
    n_shorts: 5
    sector_neutral: false

  relative_value:
    entry_zscore: 2.0
    exit_zscore: 0.5
    min_half_life: 5
    max_half_life: 60
    coint_pvalue_thresh: 0.05
    ols_window: 60
    max_pairs_scanned: 100

  market_neutral:
    beta_window: 60
    target_beta_max: 0.10
    n_longs: 8
    n_shorts: 8

  global_macro:
    enabled: true

  event_driven:
    entry_days_before: 5
    exit_days_after: 1
    max_tickers_scanned: 30

  distressed:
    altman_z_distress: 1.81
    debt_equity_max: 3.0
    price_vs_52w_pct: -40.0

  convertible_arb:
    enabled: true

  quant_systematic:
    w_momentum: 0.30
    w_value: 0.20
    w_quality: 0.20
    w_low_vol: 0.15
    w_size: 0.15
    n_longs: 10
    n_shorts: 10

  credit_long_short:
    enabled: true

  options:
    iv_rank_sell_threshold: 50
    iv_rank_buy_threshold: 30

  futures:
    trend_fast: 50
    trend_slow: 200
    risk_pct_per_trade: 0.01

  crypto:
    include_onchain: true

  forex:
    carry_enabled: true
    ppp_enabled: true

  derivatives_risk:
    enabled: true

  multi_strategy:
    weighting_mode: "risk_parity"

  master_portfolio:
    top_n_longs: 10
    top_n_shorts: 10
    max_active_hedges: 5
    risk_budgets:
      equity_long_short: 0.25
      global_macro: 0.20
      quant_systematic: 0.15
      options: 0.10
      futures: 0.10
      forex: 0.10
      credit_long_short: 0.05
      crypto: 0.05
