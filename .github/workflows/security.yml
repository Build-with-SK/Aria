name: security

# The three audit findings have regression tests. This runs them on every push
# and every pull request, so a fix that quietly stops working fails the build
# instead of failing in production with a broker attached.
#
# Keep this job fast and dependency-light — a security check that takes ten
# minutes and breaks when an unrelated SDK releases is a security check people
# start skipping.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The fence (docs/ARIA_NEXT_SESSION.md step 1). No ARIA-authored commit may
  # touch the auth layer, the live-money gate, these workflows, or the fence
  # itself. Needs the full history — fetch-depth: 0 — because a shallow clone
  # would let an older violating commit sit outside the scan and report clean.
  # --require-git makes a check that CANNOT run a failure rather than a skip.
  protected-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The fence — ARIA may not modify her own guardrails
        run: python scripts/check_protected_paths.py --require-git

  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Finding 1 — no unauthenticated execution endpoints
        run: python -m pytest tests/test_security_execution_auth.py -v

      - name: Finding 2 — IBKR order status matches IBKR
        run: python -m pytest tests/test_security_ibkr_status.py -v

      - name: Finding 3 — live accounts cannot skip human approval
        run: python -m pytest tests/test_security_live_gate.py -v

      - name: Phase 2 — market data fails over and says so
        run: python -m pytest tests/test_data_failover.py -v

      - name: Phase 3 — walk-forward replay is point-in-time
        run: python -m pytest tests/test_walkforward.py tests/test_weightfit.py -v

      - name: Phase 4 — the track record starts reporting at its threshold
        run: python -m pytest tests/test_track_record_threshold.py -v

      - name: Phase 3 — walk-forward statistics do not overstate
        run: python -m pytest tests/test_walkforward.py tests/test_weightfit.py -v

      - name: Earlier audit regressions
        run: python -m pytest tests/test_audit_fixes.py tests/test_auth_policy.py tests/test_auth_session.py tests/test_vault_security.py -v

      - name: Self-modification — the fence and the sandbox
        run: python -m pytest tests/test_protected_paths.py tests/test_selfmod_sandbox.py -v

      - name: Self-hosted brain — no vendor in the reasoning path, no silent fallback
        run: python -m pytest tests/test_inference_policy.py -v

      - name: Finding C1 — the CSRF origin guard accepts its own app and nothing else
        run: python -m pytest tests/test_origin_guard.py -v

      - name: Training — chronological splits, and no adapter promoted on noise
        run: python -m pytest tests/test_training_dataset.py tests/test_training_promotion.py -v

  # The rest of the suite. Allowed to need more of the stack; still blocking,
  # because "the security tests pass but nothing else does" is not a green build.
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run the full test suite
        run: python -m pytest tests/ -q
