name: linux-runtime
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install full application and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements.txt -r requirements-ci.txt
          python -m pip check
      - name: Database, permissions, process startup, SIGTERM and restart
        run: python -m pytest tests/test_posix_runtime.py tests/test_final_runtime.py tests/test_legacy_reconciliation.py -q
      - name: Full regression
        run: python -m pytest tests/ -q
      - name: Audit exact application dependencies in separate tooling environment
        run: |
          python -m pip list --format=freeze > installed.txt
          python -m venv /tmp/aria-audit-tools
          /tmp/aria-audit-tools/bin/pip install pip-audit
          /tmp/aria-audit-tools/bin/pip-audit -r installed.txt --no-deps --disable-pip
