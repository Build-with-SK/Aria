[pytest]
# Only tests/ is a test directory. tests/conftest.py isolates ARIA's production
# data for everything under it; a bare `pytest` from the repository root used to
# also collect root-level scripts such as test_political_imports.py, which runs
# the political pipeline at import time OUTSIDE that isolation and rewrote
# data/political/* and data/trade_candidates.json (2026-10-08).
testpaths = tests
norecursedirs = .git venv node_modules frontend data docs site mnt backup_v1_* __pycache__
